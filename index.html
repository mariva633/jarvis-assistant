<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#050b12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JARVIS">
  <meta name="description" content="JARVIS - Assistente Pessoal com reconhecimento de voz">
  <title>JARVIS — Assistente</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%23050b12' width='192' height='192'/><text x='96' y='140' font-size='140' font-weight='bold' text-anchor='middle' fill='%2322d3ee' font-family='Arial'>J</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%23050b12' width='180' height='180'/><text x='90' y='135' font-size='120' font-weight='bold' text-anchor='middle' fill='%2322d3ee' font-family='Arial'>J</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <div class="status"><span></span> SISTEMA ONLINE</div>
      <h1>JARVIS</h1>
      <p>ASSISTENTE PESSOAL</p>
    </header>

    <section class="reactor-area">
      <div class="ring ring3"></div>
      <div class="ring ring2"></div>
      <div class="ring ring1"></div>
      <button id="mic" aria-label="Falar com JARVIS">
        <div class="core">J</div>
      </button>
      <div id="state">TOQUE PARA FALAR</div>
    </section>

    <section class="panel">
      <div class="label">RESPOSTA</div>
      <div id="response">Olá. Estou pronto para receber seu comando.</div>
    </section>

    <section class="panel">
      <div class="label">HISTÓRICO</div>
      <div id="history" class="history">Nenhum comando ainda.</div>
    </section>

    <div class="input-row">
      <input id="text" placeholder="Digite um comando..." autocomplete="off">
      <button id="send">ENVIAR</button>
    </div>

    <div class="info-bar">
      <span id="battery">🔋 100%</span>
      <span id="connection">📡 Online</span>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
